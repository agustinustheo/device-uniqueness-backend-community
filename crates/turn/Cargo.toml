[package]
name = "turn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

# turn is a library (domain: TURN credential issuance over a selectable
# provider — Cloudflare Realtime TURN or a self-hosted coturn relay — plus
# proof-authorized issuance). Its
# one deployable service, the stateless N-replica `turn-api`, is a role of the
# `dub` binary (`crates/dub`), entered through this crate's `routes()`. No
# database; the only chain-facing state is the
# background-refreshed ring-root cache for the proof routes.
[lib]
path = "src/lib.rs"

[dependencies]
jwt-verify.workspace = true
http-common.workspace = true
chain-types.workspace = true
chain-client.workspace = true
subxt.workspace = true
# Verify-only (no default features): no prover, no SRS data in the binary.
verifiable.workspace = true

tokio.workspace = true
axum.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
utoipa.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }

blake2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ed25519-dalek = "2"

# Tests and the Phase 0 examples need the prover ("std" pulls it in) to
# manufacture ring proofs, and `subxt-signer` to submit test attestations.
verifiable = { workspace = true, features = ["std"] }
subxt-signer.workspace = true

[lints]
workspace = true
