[package]
name = "invite-tickets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "../chain-types/build.rs"
autobins = false

# invite-tickets is a library (domain: the invitation-ticket keypair pool +
# frozen claim wire mapping). Its two deployable services — the N-replica
# `invite-tickets-api` and the single-instance `invite-tickets-pool` that
# generates keypairs and registers them on People Chain — are roles of the
# `dub` binary (`crates/dub`), entered through this crate's `routes()` and
# `pool::run()`.
[lib]
path = "src/lib.rs"

[dependencies]
jwt-verify.workspace = true
chain-types.workspace = true
chain-client.workspace = true
subxt = { workspace = true, features = ["jsonrpsee"] }
subxt-signer.workspace = true
schnorrkel = "0.11"

tokio.workspace = true
axum = { workspace = true }
http-common.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
utoipa.workspace = true
metrics.workspace = true

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "time",
] }
ed25519-dalek = "2"
hex = "0.4"
time = "0.3"
rand = "0.8"

[dev-dependencies]
subxt-rpcs = { workspace = true, features = ["mock-rpc-client"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
base64 = "0.22"

[lints]
workspace = true
